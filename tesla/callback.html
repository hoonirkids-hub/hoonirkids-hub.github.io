<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>SiaFamily 테슬라 연결</title>
<p id="m">허브로 돌아가는 중…</p>
<script>
// 테슬라 로그인 뒤 여기로 온다. state 끝에 붙여 둔 허브 주소로 code 를 넘긴다 (집 허브 주소만 허용)
const q = new URLSearchParams(location.search);
const state = q.get("state") || "";
let hub = "";
try { hub = atob(state.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")); } catch {}
const ok = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(hub) || /^http:\/\/(localhost|127\.0\.0\.1|192\.168\.\d{1,3}\.\d{1,3})(:\d+)?$/.test(hub);
if (ok && (q.get("code") || q.get("error"))) location.replace(hub + "/tesla/callback" + location.search);
else document.getElementById("m").textContent = "허브 주소를 알 수 없어요. 허브에서 다시 연결해 주세요.";
</script>
